# Local development: MySQL and Redis only, on localhost. Run the API with uv (CONTRIBUTING.md §2).
name: lazula-ai-dev

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lazula_ai
      MYSQL_USER: lazula
      MYSQL_PASSWORD: lazula            # local only
      MYSQL_ROOT_PASSWORD: lazula-root  # local only
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["127.0.0.1:3306:3306"]
    volumes: [mysql_dev:/var/lib/mysql]

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]

volumes:
  mysql_dev: {}
