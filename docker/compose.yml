# Staging and production stack (INFRASTRUCTURE.md §4.1). TAG is set by deploy.sh.
# The studio-worker service is added in M6.
name: lazula-ai

x-app: &app
  image: ghcr.io/lazula/lazula-ai:${TAG:?set TAG}
  env_file: /etc/lazula-ai/app.env
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  networks: [data, egress]
  secrets: [master_key]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [api1, api2]

  api1:
    <<: *app
    networks: [edge, data, egress]
  api2:
    <<: *app
    networks: [edge, data, egress]

  worker:
    <<: *app
    command: ["celery", "-A", "app.workers", "worker", "-Q", "ai_fast,ai_long,webhooks", "-c", "4", "-l", "info"]
    healthcheck: { disable: true }
    stop_grace_period: 60s

  beat:
    <<: *app
    command: ["celery", "-A", "app.workers", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck: { disable: true }

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    networks: [data]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file: /etc/lazula-ai/mysql.env
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci",
              "--sql-mode=STRICT_ALL_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO",
              "--log-bin=binlog", "--binlog-expire-logs-seconds=604800"]
    volumes: [mysql_data:/var/lib/mysql]
    networks: [data]

networks:
  edge: {}
  egress: {}
  data:
    internal: true

secrets:
  master_key:
    file: /etc/lazula-ai/master.key

volumes:
  caddy_data: {}
  caddy_config: {}
  redis_data: {}
  mysql_data: {}
