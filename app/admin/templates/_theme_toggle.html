{# Day/Night switch. Plain links (no JavaScript): the server stores the choice in a cookie. #}
<nav class="theme-toggle" aria-label="Day or night colors">
  <a class="theme-option theme-day" href="/admin/theme/light?back={{ here | urlencode }}">
    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" class="icon">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
    <span>Day</span>
  </a>
  <a class="theme-option theme-night" href="/admin/theme/dark?back={{ here | urlencode }}">
    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" class="icon">
      <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
    </svg>
    <span>Night</span>
  </a>
</nav>
